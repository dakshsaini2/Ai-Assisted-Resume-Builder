services:
  postgres:
    image: postgres:16-alpine
    container_name: resume_builder_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: resume_user
      POSTGRES_PASSWORD: resume_pass_dev
      POSTGRES_DB: resume_builder
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
